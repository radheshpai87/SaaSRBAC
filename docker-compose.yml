version: "3.8"

services:
  novadesk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novadesk-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - AUTH_SECRET=${AUTH_SECRET:-changeme_random_secure_hex_string_32_chars}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/novadesk}
    volumes:
      # Persistent storage directory for app data & embedded database state
      - novadesk-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  novadesk-data:
    driver: local
